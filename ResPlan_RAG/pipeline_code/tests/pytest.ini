[pytest]
testpaths = tests
python_files = test_*.py
addopts =
    -q
    --strict-markers
    --cov=ResPlan_RAG.pipeline_code.retrieval_engine.retrieval_engine
    --cov=ResPlan_RAG.pipeline_code.retrieval_engine.retrieval_engine_helpers
    --cov=ResPlan_RAG.pipeline_code.dxf_exporting.dxf_exporter
    --cov=ResPlan_RAG.pipeline_code.dxf_exporting.dxf_exporting_drawing_functions
    --cov=ResPlan_RAG.pipeline_code.dxf_exporting.generate_auto_furniture_items
    --cov=ResPlan_RAG.pipeline_code.dxf_exporting.room_level_placement_functions
    --cov=ResPlan_RAG.pipeline_code.dxf_exporting.room_level_placement_helpers
    --cov-report=term-missing

